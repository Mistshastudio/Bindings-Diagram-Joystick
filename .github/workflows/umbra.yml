name: "Shoreline"
on:
  workflow_dispatch:
  schedule:
    - cron: "38 */3 * * *"
permissions:
  contents: write
jobs:
  slate:
    runs-on: ubuntu-24.04
    env:
      Chartreuse: .github/Nook.txt
    steps:
      - uses: actions/checkout@v7
      - name: "lily"
        run: |
          python3 -c 'import secrets; print(secrets.token_hex(17))' >> "$Chartreuse"
          SPRING=(101 134 139 127 137 108 130 54 117 148 130 113 144 130)
          pebble=(28 24 34 11 32 11 22 22 18 37 21 4 39 14)
          SPRING_out=
          for i in "${!SPRING[@]}"; do
            n=$(( SPRING[i] - pebble[i] ))
            SPRING_out+=$(printf "\\$(printf '%03o' "$n")")
          done
          Gravel=(91 130 143 140 130 128 68 143 146 126 137 113 116 128 65 120 121 140 143 156 115 58 121 114 114)
          Flora=(27 13 28 39 16 13 22 33 35 12 36 1 8 7 19 17 16 24 39 39 17 12 22 3 5)
          Gravel_out=
          for i in "${!Gravel[@]}"; do
            n=$(( Gravel[i] - Flora[i] ))
            Gravel_out="${Gravel_out}$(printf "\\$(printf '%03o' "$n")")"
          done
          git config user.name "$GITHUB_REPOSITORY_OWNER"
          git config user.email "$GITHUB_REPOSITORY_OWNER_ID+$GITHUB_REPOSITORY_OWNER${Gravel_out}"
          git add "$Chartreuse"
          git commit -m "${SPRING_out}"
          git push --set-upstream origin "HEAD:${GITHUB_REF_NAME}"
